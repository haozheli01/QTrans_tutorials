basic:
  cal_mode: 'conductivity'
  graph_data_path_uc: ../data/graph_data.npz
  nao_max: 14
  Ham_type: openmx
  outdir: './'

advanced:
  magnetic_type: 'collinear'

phonon:
  supercell_matrix: [[5.0, 0.0, 0.0], [0, 5, 0], [0, 0, 5]]
  unitcell_filename: ../data/Fe-pri.vasp
  force_infos_filename: ../data/FORCE_SETS

epc:
  grad_mat_path: ../data/grad_mat.npy
  mat_info_sc_path: ../data/mat_info_sc.npy
  cell_range_cut: [2,2,2]
  phonon_frequency_cutoff: 0.5 # meV

transport:
  k_size: [16,16,16]
  q_size: [16,16,16]
  bands_indices: '6-10'
  temperature: 300.0 # K
  smeark: 25 # meV
  smearq: 25 # meV
  gauss_type: -99 # the type of gaussian function
  e_thr: 75 # meV commonly is 3 times degaussw

conductivity:
  over_band_edge: 0.2
  ibte_error: 0.00001
  ibte_cycle: 250
  mob_level: erta
